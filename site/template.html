<!doctype html>
<html lang="zh-Hant-HK" data-accent="{{accent}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="香港中學文憑考試資訊及通訊科技科（新課程）溫習重點、評卷要點與常見錯誤">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EICT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{root}}assets/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("ictrev-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var f = localStorage.getItem("ictrev-font");
      if (f) document.documentElement.setAttribute("data-font", f);
    } catch (e) {}
  })();
</script>
</head>
<body class="kind-{{kind}} {{has_toc}}" data-page="{{page_id}}" data-root="{{root}}">
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="開啟目錄" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="{{root}}index.html">
    <span class="brand-mark" aria-hidden="true">ICT</span>
    <span class="brand-text">{{site_title}}</span>
  </a>
  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search-input" type="search" placeholder="搜尋課題、術語……" autocomplete="off" aria-label="搜尋" aria-controls="search-results" aria-expanded="false">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <div id="search-results" class="search-results" role="listbox" hidden></div>
  </div>
  <div class="topbar-tools">
    <button class="icon-btn" type="button" data-font-toggle aria-label="調整字體大小" title="字體大小">
      <span class="font-icon" aria-hidden="true">A<small>A</small></span>
    </button>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切換深色／淺色模式" title="深色／淺色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="網站目錄">
    <nav class="nav">
{{nav}}
    </nav>
  </aside>
  <div class="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <article class="content">
{{header}}
{{main}}
    </article>
    <footer class="footer">
      <p>內容依據課程發展議會與考評局《資訊及通訊科技課程及評估指引》及考評局公開資料整理，僅供溫習參考。</p>
    </footer>
  </main>

  <aside class="toc-rail">
{{toc}}
  </aside>
</div>

<button class="to-top" type="button" aria-label="回到頁頂" hidden>↑</button>
<script src="{{root}}assets/search-index.js"></script>
<script src="{{root}}assets/app.js"></script>
</body>
</html>
