<!doctype html>
<html lang="zh-Hant-HK" data-lang="zh" data-accent="{{accent}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title_zh}}</title>
<meta name="description" content="香港中學文憑考試資訊及通訊科技科（新課程）溫習重點、評卷要點與常見錯誤 · HKDSE ICT (new curriculum) revision notes, marking points and common mistakes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Georgia' font-weight='700' fill='%23b5222e' text-anchor='middle'%3EICT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{root}}assets/style.css">
<script>
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem("ictrev-theme");
      if (t) d.setAttribute("data-theme", t);
      var f = localStorage.getItem("ictrev-font");
      if (f) d.setAttribute("data-font", f);
      var l = localStorage.getItem("ictrev-lang");
      if (l === "en") { d.setAttribute("data-lang", "en"); d.setAttribute("lang", "en"); }
    } catch (e) {}
  })();
</script>
</head>
<body class="kind-{{kind}} {{has_toc}}" data-page="{{page_id}}" data-root="{{root}}" data-title-zh="{{title_zh}}" data-title-en="{{title_en}}">
<a class="skip-link" href="#main"><span class="lang-zh">跳到主要內容</span><span class="lang-en">Skip to content</span></a>

<header class="topbar">
  <button class="icon-btn menu-btn" type="button" data-i18n-aria="menu" aria-label="開啟目錄" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="{{root}}index.html">
    <span class="brand-mark" aria-hidden="true">ICT</span>
    <span class="brand-text">{{brand}}</span>
  </a>
  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search-input" type="search" data-i18n-placeholder="search" placeholder="搜尋課題、術語……" autocomplete="off" aria-label="搜尋" aria-controls="search-results" aria-expanded="false">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <div id="search-results" class="search-results" role="listbox" hidden></div>
  </div>
  <div class="topbar-tools">
    <div class="lang-switch" role="group" aria-label="語言 Language">
      <button type="button" data-lang-set="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang-set="en" aria-pressed="false">EN</button>
    </div>
    <button class="icon-btn" type="button" data-font-toggle data-i18n-aria="font" aria-label="調整字體大小">
      <span class="font-icon" aria-hidden="true">A<small>A</small></span>
    </button>
    <button class="icon-btn" type="button" data-theme-toggle data-i18n-aria="theme" aria-label="切換深色／淺色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <nav class="nav">
{{nav}}
    </nav>
  </aside>
  <div class="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <article class="content">
{{header}}
{{main}}
    </article>
    <footer class="footer">
      <p class="lang-zh">內容依據課程發展議會與考評局《資訊及通訊科技課程及評估指引》及考評局公開資料整理，僅供溫習參考。</p>
      <p class="lang-en" lang="en">Compiled from the CDC–HKEAA Information and Communication Technology Curriculum and Assessment Guide and HKEAA public materials, for revision reference only.</p>
    </footer>
  </main>

  <aside class="toc-rail">
{{toc}}
  </aside>
</div>

<button class="to-top" type="button" data-i18n-aria="top" aria-label="回到頁頂" hidden>↑</button>
<script src="{{root}}assets/search-index.js"></script>
<script src="{{root}}assets/app.js"></script>
</body>
</html>
